databases:
  - name: event-vendor-platform-db
    databaseName: event_vendor_platform
    user: evp_user
    plan: free

services:
  - type: web
    name: event-vendor-platform-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: POSTGRES_USER
        fromDatabase:
          name: event-vendor-platform-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: event-vendor-platform-db
          property: password
      - key: POSTGRES_SERVER
        fromDatabase:
          name: event-vendor-platform-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: event-vendor-platform-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: event-vendor-platform-db
          property: database
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: ENVIRONMENT
        value: production
      # Render suffixed the frontend's name on this account (the plain name
      # was already taken) — update this if the frontend's actual URL in the
      # dashboard ever changes again. Must be a JSON array literal:
      # BACKEND_CORS_ORIGINS is a List[str], and pydantic-settings
      # JSON-decodes list-typed env vars before the app's own
      # comma-splitting validator ever runs.
      - key: BACKEND_CORS_ORIGINS
        value: '["https://event-vendor-platform-web-tmpg.onrender.com"]'

  - type: web
    name: event-vendor-platform-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Render suffixed the backend's name on this account (the plain name
      # was already taken) — update this if the backend's actual URL in the
      # dashboard ever changes again. This is baked in at build time, so a
      # change here only takes effect on the next deploy of this service.
      - key: VITE_API_BASE_URL
        value: https://event-vendor-platform-api-x4c6.onrender.com/api/v1
